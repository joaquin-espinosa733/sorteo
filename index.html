<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sorteos Sute</title>

    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico" />

    <link
      href="https://fonts.googleapis.com/css2?family=Sansita:wght@400;700;800&family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <div class="contenedor">
      <h1>Sorteo Fiesta Día del Celador</h1>

      <div class="carga-archivo">
        <label for="archivo">Seleccionar archivo de participantes:</label>
        <input type="file" id="archivo" accept=".txt" />
      </div>

      <!-- Aviso sobre el formato del TXT -->
      <div class="formato-archivo">
        <strong>📄 Formato del archivo TXT</strong>
        <p>Un participante por línea.</p>
        <p>✅ Juan Pérez</p>
        <p>✅ María González</p>
        <p>❌ No colocar varios participantes en una misma línea.</p>
      </div>

      <!-- Estado del sorteo -->
      <div id="estadoSorteo" class="estado-sorteo">
        <div>
          👥 Participantes disponibles:
          <strong id="participantesDisponibles">0</strong>
        </div>

        <div>
          🏆 Ganadores guardados:
          <strong id="ganadoresGuardados">0</strong>
        </div>
      </div>

      <!-- Aviso si ya existen ganadores -->
      <div id="avisoGanadores" class="aviso-ganadores"></div>

      <div class="premio">
        <label for="premio">Premio / Sorteo:</label>
        <input type="text" id="premio" placeholder="Ej: Viaje a San Rafael" />
      </div>

      <div class="cantidad">
        <label for="cantidad">Cantidad de ganadores:</label>
        <input type="number" id="cantidad" min="1" value="1" />
      </div>

      <div id="cuenta-regresiva"></div>

      <div id="ganadores"></div>

      <div id="contador">Ganadores hasta ahora: 0</div>

      <div class="botones">
        <button id="botonSortear" onclick="sortear()">Sortear</button>

        <button onclick="reiniciar()">
          🗑️ Nuevo sorteo / Borrar ganadores
        </button>

        <button id="botonDescargar" onclick="descargarGanadores()">
          Descargar ganadores (0)
        </button>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
